services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: groundtruth-postgres
    environment:
      POSTGRES_USER: groundtruth_user
      POSTGRES_PASSWORD: groundtruth_pass
      POSTGRES_DB: groundtruth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundtruth_user -d groundtruth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groundtruth-backend
    environment:
      - DATABASE_URL=postgresql://groundtruth_user:groundtruth_pass@postgres:5432/groundtruth_db
      - SECRET_KEY=groundtruth-production-secret-key-super-secure-change-in-prod
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - EMBEDDING_DIMENSION=1536
      - RETRIEVAL_THRESHOLD=0.45
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: groundtruth-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
